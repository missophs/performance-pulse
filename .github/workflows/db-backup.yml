name: Weekly database backup

# The Supabase project is on the free tier, which has no automated
# backups (Pro tier gets a rolling 7 days; that costs $25/mo, not
# something this pilot needs to spend yet). This is Supabase's own
# documented free alternative: dump the database with the CLI and
# commit it here. https://supabase.com/docs/guides/deployment/ci/backups
#
# Dated subfolder per run (not overwriting the same 3 files every day)
# so a bad write/delete that happens the same day a backup runs doesn't
# wipe out yesterday's copy along with it -- the whole point is a safety
# net, so keeping a few days of history is worth the repo growth.
# ponytail: unbounded growth over months, prune old db-backups/ folders
# if this repo starts feeling heavy.
#
# This repo is private -- Supabase's own docs are explicit that this
# approach must never be used on a public repo, since the dump is real
# production data (real 1:1 conversations, feedback, goals).
#
# Setup required (one-time, in the GitHub repo's own settings, not
# here): Settings -> Secrets and variables -> Actions -> New repository
# secret, for each of:
#   SUPABASE_DB_URL             Project Settings -> Database -> Connection
#                                string -> URI (Session pooler, not Direct
#                                connection -- runners are IPv4-only).
#   SUPABASE_SERVICE_ROLE_KEY   Project Settings -> API -> service_role key.
#   SUPABASE_URL                Project Settings -> API -> Project URL.
#     (this one isn't actually secret -- it's the same public URL the app
#     itself ships to the browser -- but GitHub secrets are the easiest
#     place that's already wired up to reach this workflow.)
# Never paste any of these into a chat, a commit, or anywhere outside
# their own GitHub secret field.

on:
  schedule:
    - cron: "0 9 * * 0" # 9am UTC every Sunday
  workflow_dispatch: {}

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      supabase_db_url: ${{ secrets.SUPABASE_DB_URL }}
      supabase_url: ${{ secrets.SUPABASE_URL }}
      supabase_service_role_key: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Make today's backup folder
        run: |
          echo "BACKUP_DIR=db-backups/$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"
      - name: Backup roles
        run: |
          mkdir -p "$BACKUP_DIR"
          supabase db dump --db-url "$supabase_db_url" -f "$BACKUP_DIR/roles.sql" --role-only
      - name: Backup schema
        run: supabase db dump --db-url "$supabase_db_url" -f "$BACKUP_DIR/schema.sql"
      - name: Backup data
        run: supabase db dump --db-url "$supabase_db_url" -f "$BACKUP_DIR/data.sql" --data-only --use-copy
      # db dump only covers the Postgres database -- it never touches
      # Supabase Storage, so uploaded files (documents, the handbook PDF)
      # were silently unprotected until this step. One page of results per
      # bucket (up to 1000 files) is plenty for this pilot's scale.
      - name: Backup storage buckets (documents, handbook)
        run: |
          for bucket in documents handbook; do
            dest="$BACKUP_DIR/storage/$bucket"
            mkdir -p "$dest"
            http_code=$(curl -s -o /tmp/list-$bucket.json -w '%{http_code}' -X POST "$supabase_url/storage/v1/object/list/$bucket" \
              -H "apikey: $supabase_service_role_key" \
              -H "Authorization: Bearer $supabase_service_role_key" \
              -H "Content-Type: application/json" \
              -d '{"prefix": "", "limit": 1000}')
            if [ "$http_code" != "200" ]; then
              body=$(jq -r '.message // .error // "no error body"' "/tmp/list-$bucket.json" 2>/dev/null | tr '\r\n' '  ' | sed 's/::/: /g' | LC_ALL=C.UTF-8 cut -c1-200)
              echo "::warning::failed to list $bucket (HTTP $http_code): ${body:-no error body} -- nothing backed up for this bucket"
              continue
            fi
            names=$(jq -r '.[]?.name // empty' /tmp/list-$bucket.json)
            for name in $names; do
              # Object names can include subfolders (e.g. documents/<pair_id>/<uuid>-<file>),
              # so the destination's parent dir has to exist before curl -o can write there.
              mkdir -p "$(dirname "$dest/$name")"
              curl -sf "$supabase_url/storage/v1/object/$bucket/$name" \
                -H "apikey: $supabase_service_role_key" \
                -H "Authorization: Bearer $supabase_service_role_key" \
                -o "$dest/$name" || echo "::warning::failed to download $bucket/$name"
            done
          done
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Weekly database backup"
          commit_user_name: "Database Backup Bot"
